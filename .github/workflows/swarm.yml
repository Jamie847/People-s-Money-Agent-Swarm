name: The People's Watch daily run

on:
  schedule:
    - cron: '17 14 * * *'   # every day at 14:17 UTC (sentinels daily; the rule itself on its quarterly dates)
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
  attestations: write

concurrency:
  group: swarm-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      # Always build on the CURRENT record, even when an old run is re-run from the Actions page.
      # No credentials are left on disk, so sandboxed community agents cannot find a token.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the OpenTimestamps client (Bitcoin witness)
        run: pipx install opentimestamps-client

      - name: Tests
        run: npm test

      - name: Community agents (sandboxed — no secrets, no network, read-only)
        run: node scripts/community.js --isolate

      - name: Red team (attacks a throwaway copy of the record)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SWARM_REPORTER_MODEL: claude-haiku-5-5
        run: node scripts/redteam.js

      - name: Run the agents (all tiers)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SWARM_REPORTER_MODEL: claude-haiku-5-5   # low-cost model; the reporter makes one short call per run
        run: node scripts/run.js || echo "SWARM_AUDIT_FAILED=1" >> "$GITHUB_ENV"

      - name: Draft the monthly newsletter (once a month, on or after the 16th)
        id: newsletter
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SWARM_REPORTER_MODEL: claude-haiku-5-5
        run: node scripts/newsletter.js --auto

      - name: Checkpoint the ledger
        id: cp
        run: node scripts/witness.js prepare

      - name: Witness 1 — anchor in Bitcoin (OpenTimestamps)
        continue-on-error: true
        run: node scripts/witness.js ots

      - name: Witness 2 — public attestation (Sigstore transparency log)
        id: attest
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.cp.outputs.checkpoint }}

      - name: Record the attestation
        if: steps.attest.outcome == 'success'
        run: node scripts/witness.js attest "${{ steps.attest.outputs.bundle-path }}" "${{ steps.attest.outputs.attestation-url }}"

      - name: Seal results into the repository
        id: seal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "peoples-watch[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Daily run $(date -u +%F)" || echo "Nothing to commit"
          git pull --rebase origin main
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Witness 3 — outside copy (Internet Archive)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/witness.js wayback "${{ steps.seal.outputs.sha }}"
          git add data/witnesses.json
          git commit -m "Witness: archive copy of checkpoint" || exit 0
          git pull --rebase origin main
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

      - name: Open GitHub issues for new human-gate packets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/open-issues.js

      - name: Tell a person the newsletter draft is ready
        if: steps.newsletter.outputs.drafted != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MONTH: ${{ steps.newsletter.outputs.drafted }}
        run: |
          gh label create newsletter --color C9A54C --description "Monthly newsletter draft waiting for a person" --force || true
          gh issue create --label newsletter --title "Newsletter draft ready: ${MONTH}" --body "The monthly issue for ${MONTH} was drafted from this month's sealed record: [data/newsletter/${MONTH}.json](https://github.com/${GITHUB_REPOSITORY}/blob/main/data/newsletter/${MONTH}.json).

          It is loaded into beehiiv as a **draft**. Nothing is sent automatically: a person reads it, edits if needed, and presses send. Close this issue once it has gone out."

      - name: Build dashboard
        run: node scripts/build-site.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Fail the run if the auditor failed
        if: env.SWARM_AUDIT_FAILED == '1'
        run: |
          echo "The auditor reported a failure. Results were still published for transparency."
          exit 1

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
