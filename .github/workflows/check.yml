name: Check

on:
  pull_request: {}
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests and audit of the committed record
        run: npm run check
      - name: Recompute the latest live quarter independently (Python)
        run: python3 scripts/recompute.py
      - name: Community agents run in the sandbox and return valid reports
        run: node scripts/community.js --isolate --validate
