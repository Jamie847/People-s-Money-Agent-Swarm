name: Check

on:
  pull_request: {}
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests and audit of the committed record
        run: npm run check
      - name: Publication check (what the dashboard would publish)
        run: node scripts/build-site.js _site_check

      - name: Recompute the latest live quarter independently (Python)
        # Exit 3 means the FRED files are not in the repo (FRED's terms); the daily run recomputes with them.
        run: |
          set +e
          python3 scripts/recompute.py; s=$?
          if [ "$s" -eq 3 ]; then echo "FRED files are not published; skipped here (checked in every daily run)."; exit 0; fi
          exit $s
      - name: Community agents run in the sandbox and return valid reports
        run: node scripts/community.js --isolate --validate
